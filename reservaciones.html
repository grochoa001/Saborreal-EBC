<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Mesa Online | Sabor Real CDMX</title>
    <meta name="description" content="Asegura tu lugar en Sabor Real. Reserva en línea en nuestras sucursales Pedregal, Coyoacán o Insurgentes para tus comidas y eventos.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: #762319;">
        <div class="container">
            <a class="navbar-brand text-white fw-bold fs-3" style="font-family: 'Playfair Display', serif;" href="index.html">Sabor Real</a>
            <button class="navbar-toggler text-white bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white fw-semibold px-3" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-semibold px-3" href="menu.html">Menú</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-semibold px-3 active" href="reservaciones.html">Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link text-white fw-semibold px-3" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow border-0 p-4 rounded-4">
                    <h2 class="text-center mb-3" style="color: #762319; font-family: 'Playfair Display', serif;">Haz tu Reserva</h2>
                    <p class="text-center text-muted mb-4">Asegura un lugar para ti y tus acompañantes en cualquiera de nuestras sucursales.</p>

                    <form id="form-reserva">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre y apellido" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="sucursal" class="form-label fw-semibold">Sucursal</label>
                            <select class="form-select" id="sucursal" required>
                                <option value="">-- Selecciona una sucursal --</option>
                                <option value="Pedregal">Pedregal</option>
                                <option value="Coyoacán">Coyoacán</option>
                                <option value="Insurgentes">Insurgentes</option>
                            </select>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fecha" class="form-label fw-semibold">Fecha</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="hora" class="form-label fw-semibold">Hora</label>
                                <input type="time" class="form-control" id="hora" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2" style="background-color: #762319; border: none;">Reservar mesa</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-white py-4" style="background-color: #762319;">
        <div class="container text-center">
            <p class="m-0">&copy; 2026 Sabor Real. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- BOTÓN FLOTANTE DE WHATSAPP CON TU NÚMERO -->
    <a href="https://wa.me/525663851287?text=%C2%A1Hola%20Sabor%20Real!%20Me%20gustar%C3%ADa%20pedir%20informes%20sobre%20el%20men%C3%BA%20del%20d%C3%ADa%2C%20hacer%20un%20pedido%20o%20consultar%20disponibilidad%20de%20mesa." 
       target="_blank" 
       class="btn btn-success rounded-circle shadow-lg d-flex align-items-center justify-content-center" 
       style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; z-index: 1000; font-size: 30px;"
       title="Contáctanos por WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const formReserva = document.getElementById('form-reserva');
            
            formReserva.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const nombre = document.getElementById('nombre').value;
                const sucursal = document.getElementById('sucursal').value;
                const fecha = document.getElementById('fecha').value;
                const hora = document.getElementById('hora').value;
                
                alert('¡Reserva Confirmada en Sabor Real!\n\nEstimado/a ' + nombre + ',\ntu mesa en la sucursal ' + sucursal + ' ha sido reservada con éxito para el día ' + fecha + ' a las ' + hora + ' hrs.\n\n¡Te esperamos!');
                
                formReserva.reset();
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
